version: "3.9"

services:
  web:
    build: .
    container_name: motortaller_web
    ports:
      - "81:81"
    environment:
      - SECRET_KEY=${SECRET_KEY:-mototallersecreto2024-cambiar-en-produccion}
      - DATABASE_URL=sqlite:///taller.db
      - FLASK_ENV=production
    volumes:
      - ./instance:/app/instance
      - ./app/static/uploads:/app/app/static/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:81')"]
      interval: 30s
      timeout: 10s
      retries: 3
