<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>403 — Acceso denegado</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0D0D0D;color:#E8E8E8;font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
    .code{font-family:'Barlow Condensed',sans-serif;font-size:120px;font-weight:900;background:linear-gradient(135deg,#ef4444,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
    .msg{font-size:22px;font-weight:700;margin:12px 0 8px;}
    .sub{color:#555;font-size:15px;margin-bottom:28px;}
    a{display:inline-block;padding:11px 28px;background:#FF5C00;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;}
    a:hover{background:#e65200;}
  </style>
</head>
<body>
  <div>
    <div class="code">403</div>
    <div class="msg">Acceso denegado</div>
    <div class="sub">No tienes permiso para acceder a esta página.</div>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
