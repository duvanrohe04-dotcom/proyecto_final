{% extends 'base.html' %}
{% block title %}{{ accion }} Moto{% endblock %}
{% block page_title %}{{ accion }} Moto{% endblock %}
{% block content %}
<div style="max-width:540px;">
  <div class="card">
    <div class="card-header"><i class="fas fa-motorcycle"></i> {{ accion }} Moto</div>
    <div class="card-body-pad">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Placa <span style="color:#f87171;">*</span></label>
          <input type="text" name="placa" class="form-control" required
            value="{{ moto.placa if moto else '' }}" placeholder="Ej. ABC123" style="text-transform:uppercase;font-weight:700;letter-spacing:1px;"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Tipo</label>
          <input type="text" name="tipo" class="form-control"
            value="{{ moto.tipo if moto and moto.tipo else '' }}" placeholder="Ej. Deportiva, Scooter, Enduro"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Año modelo</label>
          <input type="number" name="modelo" class="form-control" min="1990" max="2030"
            value="{{ moto.modelo if moto and moto.modelo else '' }}" placeholder="Ej. 2020"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Propietario <span style="color:#f87171;">*</span></label>
          <select name="id_cliente" class="form-select" required>
            <option value="">— Seleccionar cliente —</option>
            {% for c in clientes %}
            <option value="{{ c.id_cliente }}" {{ 'selected' if moto and moto.id_cliente == c.id_cliente }}>{{ c.nombre }}</option>
            {% endfor %}
          </select>
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn-primary-mt"><i class="fas fa-save"></i> Guardar</button>
          <a href="{{ url_for('moto.index') }}" class="btn-secondary-mt">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
