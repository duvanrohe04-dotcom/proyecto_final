{% extends 'base.html' %}
{% block title %}{{ accion }} Mecánico{% endblock %}
{% block page_title %}{{ accion }} Mecánico{% endblock %}
{% block content %}
<div style="max-width:540px;">
  <div class="card">
    <div class="card-header"><i class="fas fa-hard-hat"></i> {{ accion }} Mecánico</div>
    <div class="card-body-pad">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Nombre completo <span style="color:#f87171;">*</span></label>
          <input type="text" name="nombre" class="form-control" required
            value="{{ mecanico.nombre if mecanico else '' }}" placeholder="Ej. Juan García"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" name="telefono" class="form-control"
            value="{{ mecanico.telefono if mecanico and mecanico.telefono else '' }}" placeholder="Ej. 310 456 7890"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Especialidad</label>
          <input type="text" name="especialidad" class="form-control"
            value="{{ mecanico.especialidad if mecanico and mecanico.especialidad else '' }}" placeholder="Ej. Motos de alto cilindraje"/>
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn-primary-mt"><i class="fas fa-save"></i> Guardar</button>
          <a href="{{ url_for('mecanico.index') }}" class="btn-secondary-mt">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
